services:
  - type: web
    name: v-shiroya-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: https://v-shiroya-api.onrender.com
      - key: FRONTEND_URL
        value: https://v-shiroya-insurance.web.app
